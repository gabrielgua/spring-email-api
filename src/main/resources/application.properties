spring.application.name=spring-email
spring.profiles.active=${SPRING_PROFILE}

# jackson
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true

# mongodb
spring.data.mongodb.auto-index-creation=true

# email
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# security
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION}

# ratelimiter
api.ratelimiter.email.limit-for-period=2
api.ratelimiter.email.limit-refresh-period=30s
api.ratelimiter.email.timeout-duration=0





