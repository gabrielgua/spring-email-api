spring.application.name=spring-email

# jackson
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true

# mongodb
spring.data.mongodb.auto-index-creation=true

# email
spring.mail.test-connection=true

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# security
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION}

# ratelimiter
api.ratelimiter.email.limit-for-period=2
api.ratelimiter.email.limit-refresh-period=30s
api.ratelimiter.email.timeout-duration=0





